name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dbus: [on, off]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libdbus-1-dev \
            qt6-base-dev-tools

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TEST_MODE=ON \
            -DWITH_DBUS_BROADCAST=${{ matrix.dbus == 'on' && 'ON' || 'OFF' }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Run clang-format check
        run: scripts/run-clang-format-check

  qmllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 declarative tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-base-dev qt6-declarative-dev \
            qt6-declarative-dev-tools 2>/dev/null || \
            sudo apt-get install -y -qq qt6-tools-dev-tools 2>/dev/null || true

      - name: Find qmllint
        id: find-qmllint
        run: |
          for p in /usr/lib/qt6/bin/qmllint /usr/lib64/qt6/bin/qmllint /usr/bin/qmllint; do
            if [ -x "$p" ]; then echo "qmllint=$p" >> $GITHUB_OUTPUT; break; fi
          done

      - name: Check qmllint version
        if: steps.find-qmllint.outputs.qmllint != ''
        id: version-check
        run: |
          VERSION=$(${{ steps.find-qmllint.outputs.qmllint }} --version 2>&1 | head -1)
          echo "qmllint version: $VERSION"
          if echo "$VERSION" | grep -q 'qmllint [6-9]\.' && echo "$VERSION" | grep -v 'qmllint 6\.[0-5]\.'; then
            echo "supported=true" >> $GITHUB_OUTPUT
          else
            echo "supported=false" >> $GITHUB_OUTPUT
            echo "qmllint too old for .qmllint.ini support — skipping (requires Qt 6.6+)"
          fi

      - name: Configure
        if: steps.version-check.outputs.supported == 'true'
        run: cmake -S . -B build-dev -DBUILD_TEST_MODE=ON

      - name: Build QML module
        if: steps.version-check.outputs.supported == 'true'
        run: cmake --build build-dev --parallel "$(nproc)" --target xdgiconqml

      - name: Run qmllint
        if: steps.version-check.outputs.supported == 'true'
        run: scripts/run-qmllint

  sanitize-asan-ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ \
            qt6-base-dev qt6-declarative-dev \
            qt6-tools-dev qt6-tools-dev-tools \
            libgl1-mesa-dev libxkbcommon-dev \
            libdbus-1-dev qt6-base-dev-tools

      - name: Configure (ASan+UBSan)
        run: |
          cmake -S . -B build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TEST_MODE=ON \
            -DWITH_DBUS_BROADCAST=OFF \
            -DXDGICONQML_SANITIZER=address+undefined

      - name: Build
        run: cmake --build build-asan --parallel "$(nproc)"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: "detect_leaks=1 abort_on_error=1 halt_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1 halt_on_error=1"
          LSAN_OPTIONS: "suppressions=${{ github.workspace }}/tests/lsan.supp"
        run: ctest --test-dir build-asan --output-on-failure

  sanitize-tsan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ \
            qt6-base-dev qt6-declarative-dev \
            qt6-tools-dev qt6-tools-dev-tools \
            libgl1-mesa-dev libxkbcommon-dev \
            libdbus-1-dev qt6-base-dev-tools

      - name: Configure (TSan)
        run: |
          cmake -S . -B build-tsan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TEST_MODE=ON \
            -DWITH_DBUS_BROADCAST=OFF \
            -DXDGICONQML_SANITIZER=thread

      - name: Build
        run: cmake --build build-tsan --parallel "$(nproc)"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          TSAN_OPTIONS: "halt_on_error=1 second_deadlock_stack=1"
        run: ctest --test-dir build-tsan --output-on-failure

