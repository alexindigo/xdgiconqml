# qmllint configuration for xdgiconqml.
# Relaxed for custom modules that lack qmltypes.

[General]
DisableDefaultLintAndFormatInfo=false

[Warnings]
# -- Relaxed (noise from custom modules) --
unqualified=disable
import=info
unresolved-type=info
uncreatable-type=info
incompatible-type=info

# -- Kept strict (real bugs) —
missing-property=error
missing-type=error
unresolved-alias=error
unintentional-empty-block=error
read-only-property=error
confusing-expression-statement=error
alias-cycle=error
duplicate-property-binding=error
assignment-in-condition=error
property-override=error
signal-handler-parameters=warning
